dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4
  envied_generator: ^1.1.0
  build_runner: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    # App icon
    - assets/images/app_icon.png
    # Onboarding
    - assets/images/onboarding/
    # Data
    - assets/data/child_development.json
    - assets/data/meal_planning.json
    - assets/data/household.json
    - assets/data/household_tasks.json
    - assets/data/budget.json
    - assets/data/future_planning.json
    - assets/data/content/recipes.json
    - assets/data/content/travel.json
    - assets/data/content/indoor.json
    - assets/data/content/education.json
    - assets/data/content/family.json
    - assets/data/content/home.json
    - assets/data/suggestions/family_communication.json
    - assets/data/suggestions/healthy_living.json
    - assets/data/suggestions/child_development.json
    - assets/data/suggestions/home_organization.json
    - assets/data/suggestions/budget_management.json
    - assets/data/suggestions/safety_measures.json
    - assets/data/suggestions/education_support.json
    - assets/data/suggestions/meal_nutrition.json
    - assets/data/suggestions/social_activities.json
    - assets/data/suggestions/digital_balance.json
    - assets/images/google_logo.svg
    # Icons
    - assets/icons/
    # Images
    - assets/images/
    # Sounds
    - assets/sounds/emergency_alarm.mp3
    - assets/sounds/notification.mp3
    # Animations
    - assets/animations/loading.json
    - assets/animations/success.json
    - assets/animations/error.json
    # Fonts
    - assets/fonts/
    - assets/images/google_drive_logo.svg

name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env for code generation
        run: |
          cat > .env <<EOF
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          STRIPE_PUBLISHABLE_KEY=
          EOF

      - name: Generate code (env.g.dart, freezed, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Localization audit (ARB tutarlılığı)
        run: dart run tool/localization_audit.dart

      - name: Hard-coded metin ratchet (gerileme önleyici)
        # Mevcut taban 264; YENİ hard-coded metin eklenince CI kırılır.
        # Taban düştükçe eşik de düşürülmelidir (yalnızca aşağı yönlü).
        run: dart run tool/hardcoded_string_scan.dart --ci 264

      - name: Analyze
        run: flutter analyze --fatal-warnings 2>&1 | tee analyze.log

      - name: Upload analyze log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log-flutter-yml
          path: analyze.log

      - name: Run tests
        run: flutter test --coverage

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env.prod from secrets
        run: |
          cat > .env.prod <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}
          EOF

      - name: Build Android APK
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=./symbols \
            --dart-define-from-file=.env.prod

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-debug:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env for code generation
        run: |
          cat > .env <<EOF
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          STRIPE_PUBLISHABLE_KEY=
          EOF

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

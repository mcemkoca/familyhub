name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # GERÇEK Supabase kimlik bilgileri (anon key PUBLIC — istemcide zaten
      # gömülü). Secret varsa onu, yoksa repodaki gerçek public değerleri
      # kullan. Placeholder KULLANMA — yoksa APK "giriş servisine ulaşılamıyor"
      # verir (placeholder.supabase.co çözülemez).
      - name: Create .env for code generation
        run: |
          SUPA_URL="${{ secrets.SUPABASE_URL }}"
          SUPA_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$SUPA_URL" ]; then SUPA_URL="https://hgzwfkhxralceriwsqzk.supabase.co"; fi
          if [ -z "$SUPA_KEY" ]; then SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhnendma2h4cmFsY2VyaXdzcXprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNjA0MjgsImV4cCI6MjA5ODYzNjQyOH0.y20aK6goMaXMDl5Nb41nBOi2omItcnzdPOHZQRFV7Bk"; fi
          cat > .env << EOF
          SUPABASE_URL=$SUPA_URL
          SUPABASE_ANON_KEY=$SUPA_KEY
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          EOF

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (debug — no signing needed)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: familyhub-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

name: Production Build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env for code generation
        run: |
          cat > .env <<EOF
          SUPABASE_URL=
          SUPABASE_ANON_KEY=
          STRIPE_PUBLISHABLE_KEY=
          EOF

      - name: Generate code (env.g.dart, freezed, etc.)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --fatal-warnings 2>&1 | tee analyze.log

      - name: Upload analyze log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log-production-yml
          path: analyze.log

      - name: Run tests
        run: flutter test

      - name: Check for hardcoded secrets
        run: |
          # Check for hardcoded API keys, tokens, passwords
          PATTERN='(apiKey|api_key|api-key|secret|token|password|private_key)\s*[:=]\s*["\x27][^"\x27]{8,}["\x27]'
          if grep -rE "$PATTERN" lib/ --include="*.dart" --exclude="*.g.dart" -l 2>/dev/null; then
            echo "❌ Potential hardcoded secrets found!"
            grep -rE "$PATTERN" lib/ --include="*.dart" --exclude="*.g.dart" -n
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

          # Check for http:// URLs
          if grep -r "http://" lib/ --include="*.dart" --exclude="*.g.dart" -l 2>/dev/null; then
            echo "❌ Insecure HTTP URLs found!"
            grep -r "http://" lib/ --include="*.dart" --exclude="*.g.dart" -n
            exit 1
          fi
          echo "✅ No insecure HTTP URLs detected"

      - name: Check for tracked generated files
        run: |
          if git ls-files | grep -q "lib/core/config/env.g.dart"; then
            echo "❌ env.g.dart should not be tracked in git!"
            exit 1
          fi
          echo "✅ No tracked generated secret files"

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env and .env.prod from secrets
        run: |
          cat > .env.prod <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}
          EOF
          cp .env.prod .env

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build APK (obfuscated)
        env:
          KEYSTORE_PATH: android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=./symbols \
            --split-per-abi \
            --dart-define-from-file=.env.prod

      - name: Build App Bundle (obfuscated)
        env:
          KEYSTORE_PATH: android/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=./symbols \
            --dart-define-from-file=.env.prod

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: symbols/

  build-ios:
    needs: analyze-and-test
    runs-on: macos-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env and .env.prod from secrets
        run: |
          cat > .env.prod <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}
          EOF
          cp .env.prod .env

      - name: Build IPA
        run: |
          flutter build ipa --release --no-codesign \
            --obfuscate \
            --split-debug-info=./symbols \
            --dart-define-from-file=.env.prod

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-symbols
          path: symbols/
